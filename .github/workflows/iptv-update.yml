name: IPTV Network Scan

# 定时：远程订阅扫台测速 + 点播单仓 → 部署 Pages
# 本机/GitHub 默认 DNS 常查不到 tv.nxog.top，prefetch 走 8.8.8.8/1.1.1.1
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: iptv-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prefetch TOP warehouse (cache for DNS-hostile builders)
        run: |
          mkdir -p sources/cache
          if node --input-type=module -e "
            import { writeFile } from 'node:fs/promises';
            import { fetchTextResilient } from './lib/dns.mjs';
            const url = 'https://tv.nxog.top/apitv.php?id=23';
            const r = await fetchTextResilient(url, {
              headers: { 'User-Agent': 'okhttp/3.15', Accept: 'application/json,*/*' },
              timeoutMs: 60000,
            });
            if (!r.ok || !r.text) {
              console.error('TOP http_' + r.status);
              process.exit(1);
            }
            await writeFile('sources/cache/TOP.json', r.text);
            console.log('TOP cache bytes=' + Buffer.byteLength(r.text));
            console.log(String(r.text).slice(0, 120));
          "; then
            echo "TOP prefetch ok"
          else
            echo "TOP live fetch failed; TOP-only is required, failing job"
            rm -f sources/cache/TOP.json
            exit 1
          fi

      - name: Network scan + build publish/
        env:
          PAGES_BASE: https://jiaxin610.github.io/tvbox-config
        run: node publish.mjs --build

      - name: Commit publish/ + TOP cache if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish/ sources/cache/TOP.json || true
          if git diff --staged --quiet; then
            echo "no publish changes"
          else
            git commit -m "chore: auto IPTV network scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload publish/
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
