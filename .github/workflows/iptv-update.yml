name: IPTV Network Scan

# 定时：远程订阅扫台测速 + 点播单仓 → 部署 Pages
# Ubuntu 可解析 tv.nxog.top（本机路由器 DNS 常污染/查无）
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: iptv-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prefetch TOP warehouse (cache for DNS-hostile builders)
        run: |
          mkdir -p sources/cache
          if curl -fsSL -A 'okhttp/3.15' --connect-timeout 20 --max-time 60 \
            'https://tv.nxog.top/apitv.php?id=23' -o sources/cache/TOP.json; then
            echo "TOP cache bytes=$(wc -c < sources/cache/TOP.json)"
            head -c 120 sources/cache/TOP.json; echo
          else
            echo "TOP live fetch failed; TOP-only is required, failing job"
            rm -f sources/cache/TOP.json
            exit 1
          fi

      - name: Network scan + build publish/
        env:
          PAGES_BASE: https://jiaxin610.github.io/tvbox-config
        run: node publish.mjs --build

      - name: Commit publish/ + TOP cache if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish/ sources/cache/TOP.json || true
          if git diff --staged --quiet; then
            echo "no publish changes"
          else
            git commit -m "chore: auto IPTV network scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload publish/
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
